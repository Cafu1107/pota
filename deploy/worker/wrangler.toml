# Hosted data proxy for the GitHub Pages build. Deploy: npm install && npm run deploy
name = "pota-proxy"
main = "src/index.mjs"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Comma-separated origins allowed to call the proxy from a browser.
ALLOWED_ORIGINS = "https://cafu1107.github.io,http://localhost:5173,http://localhost:4173"

# Game comments (server/comments.mjs). Schema: migrations/.
[[d1_databases]]
binding = "DB"
database_name = "pota-comments"
database_id = "a21b1924-0acd-44bf-a989-65c725d16aae"
migrations_dir = "migrations"

# Requests per address per minute, counted across the whole data center
# (the in-memory counters in src/index.mjs are only a fallback).
[[ratelimits]]
name = "LIMIT_PROXY"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "LIMIT_READ"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_WRITE"
namespace_id = "1003"
simple = { limit = 12, period = 60 }
