name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for /pota/ with the hosted data proxy
        run: npx vite build
        env:
          VITE_BASE: /pota/
          # Set in Settings → Secrets and variables → Actions → Variables,
          # e.g. https://pota-proxy.<account>.workers.dev/proxy (see deploy/worker).
          VITE_PROXY_BASE: ${{ vars.POTA_PROXY_BASE }}
      # Pages serves 404.html for unknown paths; the app's router takes it from there.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
